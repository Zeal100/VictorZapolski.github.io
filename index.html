        :root {

        * { margin: 0; padding: 0; box-sizing: border-box; }

        .nav-links { list-style: none; display: flex; }
        .nav-links li { margin-left: 2rem; }
        .nav-links a { text-decoration: none; color: var(--text-light); font-weight: 500; transition: 0.3s; border-bottom: 2px solid transparent; }
        .nav-links a:hover { color: var(--aurora-purple); border-bottom: 2px solid var(--aurora-purple); }
        .hero { height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; background: linear-gradient(rgba(2, 13, 8, 0.4), rgba(2, 13, 8, 0.7)), url('PHOTO-2025-05-31-21-22-36_2.jpg'); background-size: cover; background-position: center; }
        .hero h1 { font-size: 3.5rem; color: var(--gold); margin-bottom: 0.5rem; text-shadow: 0 0 15px rgba(0,0,0,0.9); }
        .hero p { font-size: 1.3rem; max-width: 700px; padding: 0 1rem; color: var(--text-light); text-shadow: 0 0 10px rgba(0,0,0,0.9); }
    </style>
</head>
